repositories:
  transience-defs:
    url: https://github.com/TRANSIENCE-MIC3/transience-nomenclature-definitions.git
    release: multi_nomenclature
  common-definitions-fork:
    url: https://github.com/ciceroOslo/common-definitions.git
    release: main
dimensions:
  - variable
  - region
  - model
  - scenario
definitions:
  variable:
    repository: transience-defs
    file: definitions/variable/energy/capacity-electricity.yaml
  region:
    repository: transience-defs
    file: definitions/region/common.yaml
  model:
    repository: transience-defs
    file: definitions/model/transience_models.yaml
  scenario:
    repository: transience-defs
    file: definitions/scenario/common_scenarios.yaml
mappings:
  repository: transience-defs
  file: mappings/GCAM_7.1.yaml
vetting:
  checks:
    - repository: transience-defs
      file: vetting/gdp_pop_harmonization.yaml
